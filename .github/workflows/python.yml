name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # NOTE: windows is pinned to windows-2022 (not windows-latest).
        # ggsql 0.5.2 pins duckdb ~1.10502, whose bundled build uses
        # stdext::checked_array_iterator (via vendored fmt). That symbol is
        # deprecated but present in windows-2022's VS2022/v143 STL, and fully
        # removed in the VS2026/v145 STL that windows-latest now provides, so
        # the duckdb build hard-fails there (duckdb/duckdb-rs#783, fixed in
        # libduckdb-sys 1.10506). Upstream ggsql pins windows-2022 for the
        # same reason. Revert to windows-latest once we depend on a ggsql
        # release with duckdb ~1.10506.
        os: [ubuntu-latest, macos-latest, windows-2022]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            delay: 140
          - os: macos-latest
            delay: 210
          - os: windows-2022
            delay: 70
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Stagger start by OS
        run: sleep ${{ matrix.delay }}s
        shell: bash

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-python
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.python == '3.13' }}

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release
          sccache: false

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          WHEEL=$(ls target/wheels/ggsql-*.whl)
          pip install "${WHEEL}[test]"

      - name: Run tests
        shell: bash
        run: pytest tests/ -v
