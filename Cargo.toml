[package]
name = "ggsql-python"
version = "0.5.2"
edition = "2021"
authors = ["ggsql Team"]
license = "MIT"
repository = "https://github.com/posit-dev/ggsql-python"
homepage = "https://ggsql.org"
description = "Python bindings for ggsql"
rust-version = "1.88"

[lib]
name = "_ggsql"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
arrow = { version = "58", default-features = false, features = ["ipc", "ffi"] }
ggsql = { version = "0.5.2", default-features = false, features = ["duckdb", "vegalite", "builtin-data", "svg", "pdf", "hep", "spatial"] }

[features]
default = []
